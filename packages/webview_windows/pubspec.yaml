name: webview_windows
description: A WebView2-powered webview implementation for the Windows platform. Fork with the window focus fix (jnschulze/flutter-webview-windows#230).
version: 0.5.0
repository: https://github.com/omar-hanafy/packages
homepage: https://github.com/omar-hanafy/packages/tree/webview-windows-2026-focus-fix/packages/webview_windows

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: WebviewWindowsPlugin
